name: Application verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Runner smoke test
        run: |
          echo "runner-ok"
          python --version
          node --version
          ffmpeg -version | head -n 1
          uname -a

  pytest:
    needs: runner-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.115,<1" "pydantic>=2.8,<3" "pydantic-settings>=2.4,<3" "httpx>=0.27,<1" "pytest>=8,<9" "pytest-asyncio>=0.23,<2"
      - name: Run Python and FFmpeg tests
        run: pytest -q

  remotion-smoke:
    needs: runner-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Remotion
        run: npm install --no-audit --no-fund
      - name: Create one-second render props
        run: |
          mkdir -p out
          cat > smoke-props.json <<'EOF'
          {"title":"CI smoke","topic":"Remotion real render","script":"Prueba real","duration_seconds":1,"assets":[],"voice_audio":null}
          EOF
      - name: Render real MP4
        run: npx remotion render src/index.ts Video out/smoke.mp4 --props smoke-props.json
      - name: Verify MP4
        run: |
          test -s out/smoke.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 out/smoke.mp4

  openai-model-smoke:
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    needs: runner-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP dependency
        run: pip install "httpx>=0.27,<1" "pydantic-settings>=2.4,<3"
      - name: Call configured OpenAI model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import asyncio
          from app.providers.openai_model import OpenAIModelProvider

          async def main():
              result = await OpenAIModelProvider().generate(
                  "Responde únicamente con OK.",
                  system="Eres un verificador de integración.",
              )
              assert result.strip(), "El modelo no devolvió texto"
              print("OPENAI_MODEL_SMOKE_OK:", result[:200])

          asyncio.run(main())
          PY
