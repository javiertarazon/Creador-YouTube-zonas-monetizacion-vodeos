name: Unit tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.115,<1" "pydantic>=2.8,<3" "pydantic-settings>=2.4,<3" "httpx>=0.27,<1" "pytest>=8,<9" "pytest-asyncio>=0.23,<2"
      - name: Run unit and API tests
        run: pytest -q
